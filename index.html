<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 命运预言</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#100d0f;color:#f6eee5;font-family:Georgia,serif}main{min-height:100vh;display:grid;place-items:center;padding:18px}.stage{width:min(100%,520px);min-height:calc(100vh - 36px);padding:25px 20px 18px;border:1px solid #d9ad6b66;background:radial-gradient(circle at 50% 25%,#421925,#100d0f 62%);display:flex;flex-direction:column;justify-content:space-between;text-align:center}.brand{color:#d9ad6b;letter-spacing:.14em;font-size:12px}.brand b{font-size:22px;letter-spacing:.03em}.eyebrow{color:#d9ad6b;font-size:20px}.intro{margin:auto 0}.intro h1{font-size:clamp(28px,8vw,44px);line-height:1.25;margin:0}.intro p,.locked p,.reveal p{color:#b9aaa2;line-height:1.9}.choice{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:2/3;border:1px solid #d9ad6b;background:linear-gradient(135deg,#691e2b,#1b1016);color:#f6eee5;cursor:pointer;font-size:16px;transition:.2s}.card:hover{transform:translateY(-7px);box-shadow:0 12px 28px #0008}.card small{display:block;color:#d9ad6b;font-size:9px;margin-top:35px}.locked,.reveal{display:none}.seal{width:66px;height:66px;border:1px solid #d9ad6b;border-radius:50%;display:grid;place-items:center;margin:auto;color:#d9ad6b;font-size:25px}.timer{font-size:64px;color:#d9ad6b;margin:18px}.bar{height:2px;background:#fff2}.bar i{display:block;height:100%;width:0;background:#d9ad6b}.result{width:145px;aspect-ratio:2/3;background:#f6eee5;color:#24151a;border:4px double #9c6b3d;margin:auto;padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:21px}.result strong{font-size:60px;font-weight:400}.reveal h2{color:#d9ad6b}.reveal blockquote{font-size:24px;line-height:1.7;white-space:pre-line}.btn{border:1px solid #d9ad6b;background:#d9ad6b;color:#24151a;padding:15px 25px;font-weight:bold;font-size:15px;cursor:pointer;display:none}.footer{font-size:11px;color:#85736e;letter-spacing:.12em}.locked .intro,.locked .choice{display:none}.locked .locked{display:block;margin:auto 0}.locked .btn{display:inline-block}.reveal .intro,.reveal .choice,.reveal .locked,.reveal .btn{display:none}.reveal .reveal{display:block;margin:auto 0}
</style></head><body><main><section class="stage" id="stage"><div class="brand"><b>北 Magic Bar</b><br>命运预言</div><div class="intro"><p class="eyebrow">The Prediction</p><h1>我已经提前写下了一个预言</h1><p>请从下面四张牌中，凭直觉自由选择一张。<br>不要反复比较，第一眼看到的就是你的答案。</p></div><div class="choice"><button class="card" data-card="黑桃A">♠ A<small>THE FIRST</small></button><button class="card" data-card="红心Q">♥ Q<small>THE HEART</small></button><button class="card" data-card="梅花K">♣ K<small>THE KING</small></button><button class="card" data-card="方块9">♦ 9<small>THE SIGN</small></button></div><div class="locked"><div class="seal">封</div><h2>你的选择已被记录</h2><p>预言已经封存。<br>请等待它自己揭晓。</p><div class="timer" id="timer">10</div><div class="bar"><i id="bar"></i></div></div><div class="reveal"><div class="result"><span id="corner"></span><strong id="symbol"></strong><small id="name"></small><span id="corner2"></span></div><h2>预言揭晓</h2><blockquote id="copy"></blockquote><p>你选择的牌，正是我提前写下的答案。</p></div><button class="btn" id="open">打开封存预言</button><div class="footer">北 Magic Bar · 把魔术藏进酒里</div></section></main>
<script>
const stage=document.getElementById('stage'),cards=document.querySelectorAll('.card'),open=document.getElementById('open'),timerEl=document.getElementById('timer'),bar=document.getElementById('bar');let chosen='',timer;
const data={黑桃A:['♠ A','♠','黑桃A','你选择了黑桃A。\n而这张牌，已经在预言中等你很久了。'],红心Q:['♥ Q','♥','红心Q','你选择了红心Q。\n看来今晚，心动比理智更早抵达。'],梅花K:['♣ K','♣','梅花K','你选择了梅花K。\n今晚的主角，果然是你。'],方块9:['♦ 9','♦','方块9','你选择了方块9。\n你以为这是偶然，其实它早已被写下。']};
cards.forEach(card=>{card.onclick=()=>{chosen=card.dataset.card;stage.className='stage locked';let n=10;timerEl.textContent=n;bar.style.width='0%';timer=setInterval(()=>{n--;timerEl.textContent=n;bar.style.width=((10-n)*10)+'%';if(n<=0){clearInterval(timer)}},1000)}});
open.onclick=()=>{if(!chosen)return;const d=data[chosen];document.getElementById('corner').textContent=d[0];document.getElementById('corner2').textContent=d[0];document.getElementById('symbol').textContent=d[1];document.getElementById('name').textContent=d[2];document.getElementById('copy').textContent=d[3];stage.className='stage reveal'};
</script></body></html>
