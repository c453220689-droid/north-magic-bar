<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 数字读心</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#100d0f;color:#f6eee5;font-family:Georgia,serif}main{min-height:100vh;display:grid;place-items:center;padding:18px}.stage{width:min(100%,520px);min-height:calc(100vh - 36px);padding:25px 20px 18px;border:1px solid #d9ad6b66;background:radial-gradient(circle at 50% 25%,#421925,#100d0f 62%);display:flex;flex-direction:column;justify-content:space-between;text-align:center}.brand{color:#d9ad6b;letter-spacing:.14em;font-size:12px}.brand b{font-size:22px;letter-spacing:.03em}.intro{margin:auto 0}.eyebrow{color:#d9ad6b;font-size:20px}.intro h1{font-size:clamp(29px,8vw,44px);line-height:1.25;margin:0}.intro p,.reading p,.result p{color:#b9aaa2;line-height:1.9}.btn{border:1px solid #d9ad6b;background:#d9ad6b;color:#24151a;padding:15px 25px;font-weight:bold;font-size:15px;cursor:pointer}.reading,.result{display:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:420px;margin:24px auto}.num{font-size:14px;padding:8px 0;color:#f6eee5}.yes{color:#d9ad6b}.count{font-size:62px;color:#d9ad6b;margin:15px}.bar{height:2px;background:#fff2}.bar i{display:block;height:100%;background:#d9ad6b;width:0;transition:width .3s}.result h2{color:#d9ad6b;font-size:26px}.answer{font-size:80px;color:#d9ad6b;font-weight:bold}.stage.reading .intro,.stage.reading #start{display:none}.stage.reading .reading{display:block;margin:auto 0}.stage.result .intro,.stage.result #start,.stage.result .reading{display:none}.stage.result .result{display:block;margin:auto 0}.footer{font-size:11px;color:#85736e;letter-spacing:.12em}
</style></head><body><main><section class="stage" id="stage"><div class="brand"><b>北 Magic Bar</b><br>数字读心</div><div class="intro"><p class="eyebrow">The Number Reader</p><h1>请在心里想一个<br>1—31 的数字</h1><p>不要说出来，也不要输入。<br>只要记住它，然后点击开始。</p></div><div class="reading"><h2 id="question">你的数字在这张卡里吗？</h2><div class="grid" id="grid"></div><div class="count" id="count">1 / 5</div><div class="bar"><i id="bar"></i></div><button class="btn" id="yes">有</button><button class="btn" id="no">没有</button></div><div class="result"><p>我已经读到了你的数字</p><div class="answer" id="answer">7</div><h2>你刚才想的是这个数字</h2><p>不是猜测，是一场藏在数字里的魔术。</p></div><button class="btn" id="start">开始读心</button><div class="footer">北 Magic Bar · 把魔术藏进酒里</div></section></main>
<script>
const stage=document.getElementById('stage'),grid=document.getElementById('grid'),count=document.getElementById('count'),bar=document.getElementById('bar'),answer=document.getElementById('answer');let step=0,result=0;const cards=[1,2,4,8,16];
function showCard(){grid.innerHTML='';for(let n=1;n<=31;n++){const s=document.createElement('span');s.className='num'+(n&cards[step]?' yes':'');s.textContent=n;grid.appendChild(s)}count.textContent=(step+1)+' / 5';bar.style.width=((step)/5*100)+'%'}
function begin(){step=0;result=0;stage.className='stage reading';document.querySelector('.intro').style.display='none';document.getElementById('start').style.display='none';document.querySelector('.reading').style.display='block';showCard()}
function reply(has){if(has)result+=cards[step];step++;if(step<5){showCard();return}answer.textContent=result;stage.className='stage result';document.querySelector('.intro').style.display='none';document.querySelector('.reading').style.display='none';document.getElementById('start').style.display='none';document.querySelector('.result').style.display='block'}
document.getElementById('start').onclick=begin;document.getElementById('yes').onclick=()=>reply(true);document.getElementById('no').onclick=()=>reply(false);
</script><script>
document.querySelector('.intro h1').innerHTML='请在心里想一个<br>1—99 的数字';
const extendedCards=[1,2,4,8,16,32,64];
showCard=function(){grid.innerHTML='';for(let n=1;n<=99;n++){if(n&extendedCards[step]){const s=document.createElement('span');s.className='num yes';s.textContent=n;grid.appendChild(s)}}count.textContent=(step+1)+' / 7';bar.style.width=(step/7*100)+'%'};
reply=function(has){if(has)result+=extendedCards[step];step++;if(step<7){showCard();return}answer.textContent=result;stage.className='stage result';document.querySelector('.intro').style.display='none';document.querySelector('.reading').style.display='none';document.getElementById('start').style.display='none';document.getElementById('yes').style.display='none';document.getElementById('no').style.display='none';document.querySelector('.result').style.display='block'};
document.getElementById('start').addEventListener('click',()=>{document.getElementById('yes').style.display='inline-block';document.getElementById('no').style.display='inline-block'});
document.querySelector('.intro h1').innerHTML='请把一个数字<br>藏在心里';
reply=function(has){if(has)result+=extendedCards[step];step++;if(step<7){showCard();return}stage.className='stage result';document.querySelector('.intro').style.display='none';document.querySelector('.reading').style.display='none';document.getElementById('start').style.display='none';document.getElementById('yes').style.display='none';document.getElementById('no').style.display='none';document.querySelector('.result').style.display='block';answer.textContent='？';document.querySelector('.result h2').textContent='预言正在解封';setTimeout(()=>{answer.textContent=result;document.querySelector('.result h2').textContent='你刚才想的是这个数字'},3200)};
</script><script>document.querySelector('.result p:last-of-type').textContent='答案已经出现，今晚的魔法才刚开始。';</script></body></html>
