<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 预言后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}main{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(100%,560px);padding:28px 22px;border:1px solid #d9ad6b66;background:#24131a}.brand{color:#d9ad6b;letter-spacing:.12em;text-align:center}.brand b{font-size:24px}.muted{color:#b9aaa2;line-height:1.7}.row{margin:16px 0}label{display:block;color:#d9ad6b;margin-bottom:7px}input,textarea{width:100%;border:1px solid #7d5b48;background:#140e11;color:#f6eee5;padding:13px;font:inherit}textarea{min-height:78px;resize:vertical}.btn{border:1px solid #d9ad6b;background:#d9ad6b;color:#24151a;padding:13px 19px;font-weight:bold;cursor:pointer}.ghost{background:transparent;color:#d9ad6b}.code{font-size:40px;letter-spacing:.2em;color:#d9ad6b;text-align:center;margin:18px}.hidden{display:none}.url{word-break:break-all;color:#b9aaa2;font-size:13px}
</style><main><section class="panel"><div class="brand"><b>北 Magic Bar</b><br>后台 · 预言控制台</div><div id="login"><p class="muted">店员登录后，为当前顾客设定预言。</p><div class="row"><label>后台密码</label><input id="password" type="password"></div><button class="btn" id="loginBtn">登录后台</button></div><div id="console" class="hidden"><p class="muted">先生成一个本次体验编号，顾客页面使用这个编号等待预言。</p><button class="btn" id="create">生成体验编号</button><div class="code" id="code">----</div><p class="url" id="url"></p><div class="row"><label>顾客衣服颜色</label><input id="color" placeholder="例如：黑色"></div><div class="row"><label>顾客说出的数字</label><input id="number" placeholder="例如：25"></div><div class="row"><label>顾客选择的牌</label><input id="card" placeholder="例如：黑桃 A"></div><div class="row"><label>最后一句文案（可选）</label><textarea id="copy" placeholder="例如：这一切，早已写在今晚的酒里。"></textarea></div><button class="btn" id="publish">发布预言</button><p id="status" class="muted"></p></div></section></main><script>
let token='',code='';const $=id=>document.getElementById(id);$('loginBtn').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const d=await r.json();if(d.token){token=d.token;$('login').className='hidden';$('console').className='';}else alert(d.error||'登录失败')};$('create').onclick=async()=>{const r=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json','X-Magic-Admin':token},body:'{}'});const d=await r.json();code=d.code;$('code').textContent=code;$('url').textContent=location.origin+'/guest?code='+code};$('publish').onclick=async()=>{const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Magic-Admin':token},body:JSON.stringify({code,color:$('color').value,number:$('number').value,card:$('card').value,copy:$('copy').value})});const d=await r.json();$('status').textContent=d.ok?'已发布。顾客现在可以点击“打开预言”。':(d.error||'发布失败')};
</script></html>
