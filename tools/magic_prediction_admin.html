<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 预言后台</title><style>body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}main{max-width:760px;margin:20px auto;padding:24px;background:#24131a;border:1px solid #8d684d}.brand{text-align:center;color:#d9ad6b;font-size:24px}.muted{color:#c7b8b0;line-height:1.7}.card{border:1px solid #8d684d;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input{width:100%;box-sizing:border-box;padding:10px;background:#140e11;color:#fff;border:1px solid #8d684d}label{color:#d9ad6b;font-size:13px}.btn{margin:10px 8px 0 0;padding:11px 16px;background:#d9ad6b;color:#24151a;border:0;font-weight:bold}.hidden{display:none}</style><main><div class="brand">北 Magic Bar<br><small>后台 · 预言控制台</small></div><section id="login"><p class="muted">店员登录</p><input id="password" type="password" placeholder="后台密码"><button class="btn" id="loginBtn">登录后台</button></section><section id="app" class="hidden"><p class="muted">顾客扫码后会自动出现在这里。每个卡片独立发布，也可以统一发布。</p><div id="list">等待顾客扫码……</div><button class="btn" id="all">统一发布已填写预言</button><p id="status" class="muted"></p></section></main><script>var token='';function $(x){return document.getElementById(x)}$('loginBtn').onclick=function(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}).then(function(r){return r.json()}).then(function(d){if(!d.token)return alert(d.error);token=d.token;$('login').className='hidden';$('app').className='';refresh()})};function refresh(){fetch('/api/sessions',{headers:{'X-Magic-Admin':token},cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var a=d.sessions.filter(function(s){return !s.published});$('list').innerHTML=a.length?a.map(function(s){return '<div class="card" data-code="'+s.code+'"><b>体验码：'+s.code+'</b><div class="row"><label>颜色<input name="color" placeholder="黑色"></label><label>鸡尾酒<input name="cocktail" placeholder="北马天尼"></label><label>数字<input name="number" placeholder="89"></label><label>扑克牌<input name="card" placeholder="黑桃 A"></label></div><button class="btn one">发布此位预言</button></div>'}).join(''):'等待顾客扫码……';document.querySelectorAll('.one').forEach(function(b){b.onclick=function(){publish(b.closest('.card'))}});setTimeout(refresh,1500)}).catch(function(){setTimeout(refresh,2500)})}function publish(c){var body={code:c.dataset.code,date:new Date().toLocaleDateString('zh-CN'),color:c.querySelector('[name=color]').value,cocktail:c.querySelector('[name=cocktail]').value,number:c.querySelector('[name=number]').value,card:c.querySelector('[name=card]').value};fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Magic-Admin':token},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){$('status').textContent=d.ok?'已发布：'+body.code:(d.error||'发布失败')})}$('all').onclick=function(){document.querySelectorAll('.card').forEach(function(c){publish(c)})}</script></html>
