<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOD Magic Lounge · 预言后台</title><style>body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}main{max-width:760px;margin:8px auto;padding:10px;background:#24131a;border:1px solid #8d684d}.brand{text-align:center;color:#d9ad6b;font-size:18px}.brand small{font-size:12px}.muted{color:#c7b8b0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:24px}.card{border:1px solid #8d684d;padding:12px}.card.done{border-color:#5d9c78;opacity:.78}.card b{font-size:14px}.state{float:right;color:#8fd0a8;font-size:11px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}input{width:100%;box-sizing:border-box;padding:7px 5px;background:#140e11;color:#fff;border:1px solid #8d684d;font-size:13px}label{color:#d9ad6b;font-size:11px}.btn{margin:5px 4px 0 0;padding:8px 10px;background:#d9ad6b;color:#24151a;border:0;font-weight:bold;font-size:12px}.btn:disabled{background:#4d6b58;color:#d6eee0}.danger{background:#8b4b4b;color:#fff}.hidden{display:none}@media(max-width:520px){main{margin:0;padding:10px;border:0}.cards{column-gap:10px;row-gap:22px}.card{padding:10px}.btn{width:100%;padding:7px 3px;font-size:11px}input{padding:6px 3px;font-size:12px}.muted{margin:5px 0}.brand{font-size:17px}}#all,#clear{display:inline-block;width:calc(50% - 8px);margin-top:16px;padding:12px 6px}</style><main><div class="brand">TOD Magic Lounge <small>· 后台控制台</small></div><section id="login"><p class="muted">店员登录</p><input id="password" type="password" placeholder="后台密码"><button class="btn" id="loginBtn">登录后台</button></section><section id="app" class="hidden"><p class="muted">本轮最多4位顾客 · 已发布内容仍保留</p><div id="list" class="cards">等待顾客扫码……</div><button class="btn" id="all">统一发布已填写预言</button><button class="btn danger" id="clear">清空本轮</button><p id="status" class="muted"></p></section></main><script>var token='',lastSignature='';function $(x){return document.getElementById(x)}$('loginBtn').onclick=function(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}).then(function(r){return r.json()}).then(function(d){if(!d.token)return alert(d.error);token=d.token;$('login').className='hidden';$('app').className='';refresh()})};function render(a){a=a.slice(0,4);while(a.length<4)a.push(null);var sig=a.map(function(s){return s?(s.code+':'+s.published):'empty'}).join(',');if(sig===lastSignature)return;lastSignature=sig;$('list').innerHTML=a.map(function(s){if(!s)return '<div class="card empty"><b>等待顾客扫码</b><div class="row"><label>颜色<input disabled placeholder="等待顾客"></label><label>鸡尾酒<input disabled placeholder="等待顾客"></label><label>数字<input disabled placeholder="等待顾客"></label><label>扑克牌<input disabled placeholder="等待顾客"></label></div></div>';var done=s.published?' done':'';var state=s.published?'<span class="state">已发布</span>':'';var values=s.reveal||{};return '<div class="card'+done+'" data-code="'+s.code+'"><b>体验码：'+s.code+'</b>'+state+'<div class="row"><label>颜色<input name="color" placeholder="黑色" value="'+esc(values.color)+'"></label><label>鸡尾酒<input name="cocktail" placeholder="北马天尼" value="'+esc(values.cocktail)+'"></label><label>数字<input name="number" placeholder="89" value="'+esc(values.number)+'"></label><label>扑克牌<input name="card" placeholder="黑桃 A" value="'+esc(values.card)+'"></label></div><button class="btn one" '+(s.published?'disabled':'')+'>'+(s.published?'已发布':'发布此位预言')+'</button></div>'}).join('');document.querySelectorAll('.one:not(:disabled)').forEach(function(b){b.onclick=function(){publish(b.closest('.card'))}})}function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function refresh(){fetch('/api/sessions',{headers:{'X-Magic-Admin':token},cache:'no-store'}).then(function(r){return r.json()}).then(function(d){render(d.sessions);setTimeout(refresh,1500)}).catch(function(){setTimeout(refresh,2500)})}function publish(c){var body={code:c.dataset.code,date:new Date().toLocaleDateString('zh-CN'),color:c.querySelector('[name=color]').value,cocktail:c.querySelector('[name=cocktail]').value,number:c.querySelector('[name=number]').value,card:c.querySelector('[name=card]').value};fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Magic-Admin':token},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){$('status').textContent=d.ok?'已发布：'+body.code:(d.error||'发布失败');if(d.ok){lastSignature='';refresh()}})}$('all').onclick=function(){document.querySelectorAll('.card[data-code]:not(.done)').forEach(function(c){publish(c)})};$('clear').onclick=function(){if(!confirm('确定清空当前本轮全部顾客和预言吗？'))return;fetch('/api/clear',{method:'POST',headers:{'X-Magic-Admin':token}}).then(function(r){return r.json()}).then(function(d){if(d.ok){lastSignature='';$('status').textContent='本轮已清空';refresh()}})}</script></html>
