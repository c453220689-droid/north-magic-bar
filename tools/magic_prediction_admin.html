<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 预言后台</title><style>body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}main{max-width:620px;margin:30px auto;padding:24px;background:#24131a;border:1px solid #8d684d}.brand{text-align:center;color:#d9ad6b;font-size:24px}.muted{color:#c7b8b0;line-height:1.7}label{display:block;color:#d9ad6b;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;background:#140e11;color:#fff;border:1px solid #8d684d;font:inherit}textarea{min-height:70px}.btn{margin-top:18px;padding:13px 18px;background:#d9ad6b;border:0;color:#24151a;font-weight:bold;cursor:pointer}.session{padding:14px;margin:8px 0;border:1px solid #8d684d;cursor:pointer}.session b{color:#d9ad6b;font-size:24px}.hidden{display:none}</style><main><div class="brand">北 Magic Bar<br><small>后台 · 预言控制台</small></div><section id="login"><p class="muted">店员登录</p><input id="password" type="password" placeholder="后台密码"><button class="btn" id="loginBtn">登录后台</button></section><section id="app" class="hidden"><p class="muted">最新顾客会自动出现在下面。点击编号后设置预言。</p><div id="sessions">正在等待顾客扫码……</div><hr><label>当前体验编号</label><input id="code" readonly><label>顾客衣服颜色</label><input id="color" placeholder="例如：黑色"><label>顾客说出的数字</label><input id="number" placeholder="例如：25"><label>顾客选择的牌</label><input id="card" placeholder="例如：黑桃 A"><label>最后一句文案（可选）</label><textarea id="copy" placeholder="今晚的魔法才刚开始。"></textarea><button class="btn" id="publish">发布预言</button><p id="status" class="muted"></p></section></main><script>var token='',selected='';function $(x){return document.getElementById(x)}$('loginBtn').onclick=function(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}).then(function(r){return r.json()}).then(function(d){if(!d.token){alert(d.error||'登录失败');return}token=d.token;$('login').className='hidden';$('app').className='';refresh()})};function refresh(){fetch('/api/sessions',{headers:{'X-Magic-Admin':token},cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var list=d.sessions.filter(function(s){return !s.published});$('sessions').innerHTML=list.length?list.map(function(s){return '<div class="session" data-code="'+s.code+'">体验编号：<b>'+s.code+'</b><br><small>点击选择当前顾客</small></div>'}).join(''):'正在等待顾客扫码……';document.querySelectorAll('.session').forEach(function(el){el.onclick=function(){selected=el.dataset.code;$('code').value=selected}});setTimeout(refresh,1500)}).catch(function(){setTimeout(refresh,2500)})}$('publish').onclick=function(){fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Magic-Admin':token},body:JSON.stringify({code:$('code').value,color:$('color').value,number:$('number').value,card:$('card').value,copy:$('copy').value})}).then(function(r){return r.json()}).then(function(d){$('status').textContent=d.ok?'预言已发布，顾客可以打开答案。':(d.error||'发布失败')})}</script></html>
