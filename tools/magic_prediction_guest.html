<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 命运预言</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}main{min-height:100vh;display:grid;place-items:center;padding:18px}.stage{width:min(100%,520px);min-height:calc(100vh - 36px);padding:28px 22px 20px;border:1px solid #d9ad6b66;background:radial-gradient(circle at 50% 24%,#421925,#100d0f 64%);display:flex;flex-direction:column;justify-content:space-between;text-align:center}.brand{color:#d9ad6b;letter-spacing:.14em}.brand b{font-size:23px;letter-spacing:.03em}.content{margin:auto 0}.eyebrow{color:#d9ad6b;font-size:18px}.content h1{font-size:clamp(29px,8vw,44px);line-height:1.3;margin:12px 0}.content p{color:#b9aaa2;line-height:1.9}.btn{border:1px solid #d9ad6b;background:#d9ad6b;color:#24151a;padding:15px 25px;font-weight:bold;font-size:15px;cursor:pointer}.waiting,.reveal{display:none}.stage.waiting .content,.stage.waiting #start{display:none}.stage.waiting .waiting{display:block;margin:auto 0}.stage.revealed .content,.stage.revealed #start,.stage.revealed .waiting{display:none}.stage.revealed .reveal{display:block;margin:auto 0}.seal{width:72px;height:72px;margin:0 auto 20px;border:1px solid #d9ad6b;border-radius:50%;display:grid;place-items:center;color:#d9ad6b;font-size:25px}.pulse{color:#b9aaa2}.reveal-card{padding:24px 16px;border:1px solid #d9ad6b;background:#24131a;margin:18px 0;color:#d9ad6b;font-size:27px;line-height:1.7}.hint{color:#b9aaa2;font-size:14px}.footer{font-size:11px;color:#85736e;letter-spacing:.12em}
</style><main><section class="stage" id="stage"><div class="brand"><b>北 Magic Bar</b><br>把答案藏进酒里</div><div class="content"><p class="eyebrow">The Prediction</p><h1>今晚的答案<br>早已被写下</h1><p>请告诉店员你心中的数字，<br>然后随意选择一张牌。</p></div><div class="waiting"><div class="seal">封</div><h2>你的选择已被记录</h2><p class="pulse">预言正在等待最后一笔确认……</p><p class="hint">当店员完成设定后，按钮会出现。</p></div><div class="reveal"><p class="eyebrow">预言揭晓</p><div class="reveal-card" id="revealCard"></div><p class="hint">你刚才看到的一切，已经提前写在这里。</p></div><button class="btn" id="start">开始体验</button><button class="btn" id="open" style="display:none">打开预言</button><div class="footer">北 Magic Bar · 今晚的魔法才刚开始</div></section></main><script>
const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase();const stage=document.querySelector('#stage'),open=document.querySelector('#open'),card=document.querySelector('#revealCard');let current={};
document.querySelector('#start').onclick=()=>{if(!code){alert('缺少体验编号，请让店员重新生成二维码。');return}stage.className='stage waiting';poll()};
async function poll(){try{const r=await fetch('/api/session?code='+encodeURIComponent(code),{cache:'no-store'});const d=await r.json();if(d.published){current=d.reveal;open.style.display='inline-block';open.onclick=()=>{card.innerHTML=`衣服颜色：<strong>${esc(current.color)}</strong><br>数字：<strong>${esc(current.number)}</strong><br>牌面：<strong>${esc(current.card)}</strong>${current.copy?`<br><small>${esc(current.copy)}</small>`:''}`;stage.className='stage revealed';};}else setTimeout(poll,1200)}catch(e){setTimeout(poll,1800)}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></html>
