<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 命运预言</title><style>html,body{margin:0;min-height:100%;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}body{padding:18px 0}.stage{width:calc(100% - 36px);max-width:520px;min-height:calc(100vh - 72px);margin:0 auto;border:1px solid #8d684d;background:#2b151d;text-align:center;display:flex;flex-direction:column}.brand{padding:28px 12px 10px;color:#d9ad6b;font-size:13px;letter-spacing:2px}.brand b{display:block;font-size:24px;letter-spacing:0}.content,.waiting,.reveal{margin:auto 20px}.eyebrow{color:#d9ad6b;font-size:18px}.content h1{font-size:36px;line-height:1.35;margin:14px 0}.content p,.waiting p,.reveal p{color:#c7b8b0;line-height:1.8}.waiting,.reveal{display:none}.btn{display:block;margin:20px 20px 30px;width:calc(100% - 40px);padding:16px;border:0;background:#d9ad6b;color:#24151a;font-size:16px;font-weight:bold}.reveal-card{padding:18px;border:1px solid #d9ad6b;color:#d9ad6b;font-size:24px;line-height:1.8}.footer{padding:0 8px 16px;color:#85736e;font-size:11px}</style></head><body><main class="stage" id="stage"><div class="brand"><b>北 Magic Bar</b>把答案藏进酒里</div><section class="content" id="content"><div class="eyebrow">The Prediction</div><h1>今晚的答案<br>早已被写下</h1><p>请告诉店员你心中的数字，<br>然后随意选择一张牌。</p></section><section class="waiting" id="waiting"><h2>你的选择已被记录</h2><p>预言正在等待最后一笔确认……</p></section><section class="reveal" id="reveal"><div class="eyebrow">预言揭晓</div><div class="reveal-card" id="revealCard"></div><p>你刚才看到的一切，已经提前写在这里。</p></section><button class="btn" id="start">开始体验</button><button class="btn" id="open" style="display:none">打开预言</button><div class="footer">北 Magic Bar · 今晚的魔法才刚开始</div></main><script>(function(){var p=new URLSearchParams(location.search),code=(p.get('code')||'').toUpperCase(),content=document.getElementById('content'),waiting=document.getElementById('waiting'),reveal=document.getElementById('reveal'),start=document.getElementById('start'),open=document.getElementById('open'),card=document.getElementById('revealCard'),data=null;start.onclick=function(){if(!code){alert('缺少体验编号，请让店员重新生成编号。');return}content.style.display='none';start.style.display='none';waiting.style.display='block';poll()};open.onclick=function(){card.innerHTML='衣服颜色：'+safe(data.color)+'<br>数字：'+safe(data.number)+'<br>牌面：'+safe(data.card)+(data.copy?'<br><small>'+safe(data.copy)+'</small>':'');waiting.style.display='none';open.style.display='none';reveal.style.display='block'};function poll(){fetch('/api/session?code='+encodeURIComponent(code),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){if(v.published){data=v.reveal;open.style.display='block'}else{setTimeout(poll,1200)}}).catch(function(){setTimeout(poll,2000)})}function safe(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}})();</script></body></html>
