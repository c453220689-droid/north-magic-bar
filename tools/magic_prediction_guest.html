<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北 Magic Bar · 命运预言</title><style>body{margin:0;background:#100d0f;color:#f6eee5;font-family:Georgia,"Microsoft YaHei",serif}.stage{max-width:520px;min-height:100vh;margin:auto;background:#2b151d;text-align:center;display:flex;flex-direction:column}.brand{padding:28px 10px;color:#d9ad6b;font-size:13px}.brand b{display:block;font-size:24px}.content,.waiting,.reveal{margin:auto 22px}.content h1{font-size:36px;line-height:1.35}.content p,.waiting p,.reveal p{color:#c7b8b0;line-height:1.8}.waiting,.reveal{display:none}.btn{margin:20px 22px 30px;padding:16px;background:#d9ad6b;color:#24151a;border:0;font-weight:bold;font-size:16px}.btn.disabled{background:#594a3a;color:#9b9188}.reveal-card{padding:20px;border:1px solid #d9ad6b;color:#d9ad6b;font-size:23px;line-height:1.8}.footer{padding:16px;color:#85736e;font-size:11px}.code{opacity:.18;font-size:9px;margin-top:8px}</style><main class="stage"><div class="brand"><b>北 Magic Bar</b>把答案藏进酒里</div><section class="content" id="content"><h1>今晚的答案<br>早已被写下</h1></section><section class="waiting" id="waiting"><h2>你的命运已被封存</h2></section><section class="reveal" id="reveal"><div class="reveal-card" id="card"></div><p>答案已经出现，今晚的魔法才刚开始。</p></section><button class="btn" id="start">开始体验</button><button class="btn disabled" id="open" disabled>打开预言</button><div class="footer">北 Magic Bar · 今晚的魔法才刚开始<div class="code" id="codeLabel"></div></div></main><script>(function(){var q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase(),content=document.getElementById('content'),waiting=document.getElementById('waiting'),reveal=document.getElementById('reveal'),start=document.getElementById('start'),open=document.getElementById('open'),card=document.getElementById('card');document.getElementById('codeLabel').textContent=code;start.onclick=function(){if(!code)return;content.style.display='none';start.style.display='none';waiting.style.display='block';poll()};function poll(){fetch('/api/session?code='+encodeURIComponent(code),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){if(v.published){var d=v.reveal;open.disabled=false;open.className='btn';open.onclick=function(){card.innerHTML=(d.date||new Date().toLocaleDateString('zh-CN'))+'<br>我穿着'+safe(d.color)+'上衣，<br>点了一杯'+safe(d.cocktail)+'，<br>心中想的数字是 '+safe(d.number)+'，<br>最后选到了'+safe(d.card)+'。';waiting.style.display='none';open.style.display='none';reveal.style.display='block'}}else setTimeout(poll,1200)}).catch(function(){setTimeout(poll,2000)})}function safe(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}})();</script></html>
